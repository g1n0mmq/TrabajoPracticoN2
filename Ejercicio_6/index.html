<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario de Validación</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Formulario para Registro</h1>
    <p>Por favor, complete el siguiente formulario:</p>
  <label for="nombre">Nombre:</label>
  <input type="text" id="nombre"><br><br>
  <label for="apellido">Apellido:</label>
  <input type="text" id="apellido"><br><br>
  <label for="edad">Edad (años):</label>
  <input type="number" id="edad"><br><br>
  <label for="altura">Altura (cm):</label>
  <input type="number" id="altura"><br><br>
  <label for="correo">Correo electrónico:</label>
  <input type="email" id="correo"><br><br>
  <button id="enviar">Enviar</button>
  <p id="mensaje"></p>

  <script src="script.js"></script>
</body>
</html>
